server {
    listen 80;
    listen [::]:80;
    server_name bladesbeats.com www.bladesbeats.com;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/bladesbeats/current;
        default_type text/plain;
    }

    location / {
        return 301 https://bladesbeats.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bladesbeats.com www.bladesbeats.com;

    root /srv/bladesbeats/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/bladesbeats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bladesbeats.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; frame-src https://www.youtube-nocookie.com https://www.mixcloud.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location ~ ^/(scripts|data|workers|config|release-desk|deploy)(?:/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
