name = "bladesbeats-contact"
main = "contact-worker.js"
compatibility_date = "2026-06-21"

routes = [
  { pattern = "bladesbeats.com/api/contact", zone_name = "bladesbeats.com" }
]

[vars]
ALLOWED_ORIGIN = "https://bladesbeats.com"

# Optional: set a separate BLOCKLIST_SALT secret with Wrangler. If omitted, the
# Turnstile secret is used when deriving short-lived blocklist keys from IPs.

# Optional but recommended for one-hour IP blocking after malicious form payloads:
# 1. Run: wrangler kv namespace create CONTACT_BLOCKLIST
# 2. Copy the returned id into the block below and uncomment it.
#
# [[kv_namespaces]]
# binding = "CONTACT_BLOCKLIST"
# id = "paste_kv_namespace_id_here"
