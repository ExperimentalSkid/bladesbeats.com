name: Validate website

on:
  pull_request:
  push:
    branches: [main, agent/launch-overhaul]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build:offline
      - run: npm test
      - run: bash -n deploy/deploy-from-github.sh
