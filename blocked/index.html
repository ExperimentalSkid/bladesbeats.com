<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="The BladesBeats contact form has temporarily paused submissions from this connection for one hour.">
  <title>Request temporarily blocked | BladesBeats</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#06070b;
      --panel:#10121a;
      --panel-2:#151824;
      --line:rgba(255,255,255,.14);
      --text:#f6f0e8;
      --muted:#a7a0a0;
      --red:#ff5148;
      --amber:#f2b84b;
      --cyan:#74dcff;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      padding:28px;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.6;
      background:
        radial-gradient(circle at 18% 28%, rgba(255,81,72,.18), transparent 30%),
        radial-gradient(circle at 82% 72%, rgba(116,220,255,.12), transparent 34%),
        linear-gradient(180deg,#050609 0%,#0b0d14 100%);
    }
    main{
      width:min(720px,100%);
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(21,24,36,.94),rgba(10,11,17,.94));
      box-shadow:0 24px 80px rgba(0,0,0,.42);
      padding:clamp(28px,6vw,56px);
      position:relative;
      overflow:hidden;
    }
    main:before{
      content:"";
      position:absolute;
      inset:0 0 auto;
      height:3px;
      background:linear-gradient(90deg,var(--red),var(--amber),var(--cyan));
    }
    .eyebrow{
      margin:0 0 18px;
      color:var(--red);
      font-size:12px;
      font-weight:900;
      line-height:1.45;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    h1{
      margin:0;
      max-width:10ch;
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:clamp(50px,12vw,96px);
      line-height:.95;
      letter-spacing:-.035em;
      text-wrap:balance;
    }
    p{
      max-width:58ch;
      margin:22px 0 0;
      color:var(--muted);
      font-size:clamp(16px,2.2vw,20px);
      line-height:1.65;
      text-wrap:pretty;
    }
    .console{
      margin-top:28px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.32);
      padding:14px 16px;
      color:var(--amber);
      font:700 12px/1.6 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      letter-spacing:.08em;
      text-transform:uppercase;
      overflow-wrap:anywhere;
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:30px;
    }
    a{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--line);
      padding:12px 16px;
      color:var(--text);
      text-decoration:none;
      font-size:12px;
      font-weight:900;
      line-height:1.45;
      letter-spacing:.14em;
      text-transform:uppercase;
      transition:transform .18s ease,border-color .18s ease,color .18s ease;
    }
    a:hover{transform:translateY(-2px);border-color:var(--red);color:var(--red)}
    a:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
    @media (prefers-reduced-motion:reduce){
      a{transition:none}
      a:hover{transform:none}
    }
  </style>
</head>
<body>
  <main aria-labelledby="blocked-title">
    <p class="eyebrow">Security check</p>
    <h1 id="blocked-title">Contact form paused.</h1>
    <p>A request from this connection appeared unsafe, so new form submissions are paused for one hour.</p>
    <p>The rest of the site is still available. After the cooldown, a new message can be sent as plain text.</p>
    <div class="console">HTTP 403 -&gt; 429 / cooldown: 60 minutes</div>
    <div class="actions">
      <a href="/">BladesBeats homepage</a>
    </div>
  </main>
</body>
</html>
